# Local Postgres for runs and their events.
# Start with: docker compose up -d
# Wipe with:  docker compose down -v
#
# Host port 5433, because another project on this machine already uses 5432.

services:
  db:
    image: postgres:17
    container_name: evidence-timeline-db
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
      POSTGRES_DB: evidence_timeline
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_timeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal's development server: the server and its web UI in one container.
  # UI: http://localhost:8233. Histories are kept in a file, so a restart does not lose them.
  temporal:
    image: temporalio/temporal:latest
    container_name: evidence-timeline-temporal
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - "7233:7233"  # what the worker and the CLI connect to
      - "8233:8233"  # web UI
    volumes:
      - temporal_data:/home/temporal  # the image's own user owns this directory

volumes:
  db_data:
  temporal_data:
