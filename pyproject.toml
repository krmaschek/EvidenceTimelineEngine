[project]
name = "evidence-timeline"
version = "0.1.0"
description = "Evidence Timeline Engine: turns a case's Markdown documents into a chronological, source-linked timeline of events with an LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0",
    "temporalio>=1.33.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
evidence-timeline = "evidence_timeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
